services:
  lookout:
    build:
      context: .
      dockerfile: Dockerfile
    image: lookout:latest
    container_name: lookout
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOOKOUT_CONFIG=/data/config.yaml
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
