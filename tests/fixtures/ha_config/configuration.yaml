default_config:

# Embed Lookout in Home Assistant sidebar
panel_iframe:
  lookout:
    title: "Lookout"
    icon: "mdi:cctv"
    url: "http://localhost:8000"
    require_admin: false

# Trigger Lookout via REST command
rest_command:
  lookout_trigger_event:
    url: "http://localhost:8000/api/v1/events/trigger"
    method: POST
    headers:
      Content-Type: "application/json"
    payload: '{"camera_id": "{{ camera_id }}", "source": "home_assistant_automation"}'
