# Lookout Reference Configuration
system_name: "Lookout Home"

residents:
  - id: "resident-alice"
    name: "Alice"
    notification_targets:
      - "primary-webhook"
    enrolled_faces:
      - "/data/faces/alice_1.jpg"
      - "/data/faces/alice_2.jpg"

pets:
  - id: "pet-buster"
    name: "Buster"
    species: "dog"

cameras:
  - id: "front-porch"
    name: "Front Porch Camera"
    stream_url: "rtsp://camera-front.local:554/live"
    enabled: true
    location: "Front Porch"
    sensitivity: 0.75
    record_duration: 15.0

notification_targets:
  - name: "primary-webhook"
    target_type: "webhook"
    destination: "https://notify.local/webhook/alerts"
    min_threat_level: "low"
    enabled: true

storage:
  base_path: "./data"
  retention_days: 30
  max_storage_gb: 100.0

go2rtc:
  api_url: "http://localhost:1984"
  timeout_seconds: 10.0

ring:
  auth_token: null
  api_url: "https://api.ring.com"
  timeout_seconds: 15.0

transcode:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  use_stream_copy: true
  max_threads: 2
  nice_level: 10
  temp_dir: "/dev/shm"
  gif_fps: 6
  gif_width: 320
  gif_duration: 2.5
  thumbnail_count: 5

