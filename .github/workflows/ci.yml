name: CI

'on':
  push:
    branches: [main, 'phase/**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main, 'phase/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run mypy src

      - name: Run tests with coverage
        run: uv run pytest --cov=lookout --cov-report=term-missing

  playwright-e2e:
    name: Playwright E2E Browser Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright Chromium with dependencies
        run: uv run playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: uv run pytest tests/e2e --video=retain-on-failure --tracing=retain-on-failure

      - name: Upload test results artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/

  container-and-ha:
    name: Container & Home Assistant Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.sidecar.yml config --quiet

      - name: Build Docker image
        run: docker build -t lookout:test .

      - name: Lint Home Assistant Add-On
        uses: frenck/action-addon-linter@v2
        with:
          path: "./ha-addon"
          community: false

      - name: Validate Home Assistant Core configuration schema
        run: |
          docker run --rm -v $(pwd)/tests/fixtures/ha_config:/config:ro ghcr.io/home-assistant/home-assistant:stable python -m homeassistant --config /config --script check_config

      - name: Test end-to-end container network trigger
        run: |
          docker network create lookout-net
          docker run -d --name lookout-e2e --network lookout-net -p 8000:8000 -e LOOKOUT_CONFIG=/data/config.yaml lookout:test
          sleep 5
          docker logs lookout-e2e
          docker exec lookout-e2e ffmpeg -version
          docker exec lookout-e2e python -c "import lookout; print('Lookout imported successfully')"
          docker run --rm --network lookout-net curlimages/curl:latest curl --retry 10 --retry-delay 2 --retry-connrefused -f http://lookout-e2e:8000/health
          docker run --rm --network lookout-net curlimages/curl:latest curl -f -X POST -H "Content-Type: application/json" -d '{"camera_id": "front_door"}' http://lookout-e2e:8000/api/v1/events/trigger
          docker run --rm --network lookout-net curlimages/curl:latest curl -f http://lookout-e2e:8000/api/events
          docker stop lookout-e2e && docker rm lookout-e2e
          docker network rm lookout-net

  critique:
    name: Critique AI Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      issues: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Critique AI PR Review
        uses: ajxcodes/critique@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          update_pr_description: "true"
          post_inline_comments: "true"
          post_summary_comment: "true"
          fail_on_severity: "none"

  container-publish:
    name: Multi-Arch Container Build & Publish
    runs-on: ubuntu-latest
    needs: [quality, playwright-e2e, container-and-ha]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: standalone
            context: .
            file: Dockerfile
            ghcr_image: ghcr.io/ajxcodes/lookout
            dockerhub_image: ajxcodes/lookout
            build_args: ""
          - target: ha-addon
            context: .
            file: ha-addon/Dockerfile
            ghcr_image: ghcr.io/ajxcodes/lookout-ha-addon
            dockerhub_image: ajxcodes/lookout-ha-addon
            build_args: BUILD_FROM=python:3.12-slim-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU multi-architecture emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub credentials availability
        id: dockerhub-check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub-check.outputs.enabled == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract container OCI metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ matrix.ghcr_image }}
            name=${{ matrix.dockerhub_image }},enable=${{ steps.dockerhub-check.outputs.enabled == 'true' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          push: "${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  auto-tag:
    name: Automated Semantic Release Tagging
    runs-on: ubuntu-latest
    needs: [quality, playwright-e2e, container-and-ha]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate semantic version tag and release
        uses: ajxcodes/auto-tag@v1
        with:
          default-bump: patch
          tag-prefix: v
          version-format: standard
          create-release: true
